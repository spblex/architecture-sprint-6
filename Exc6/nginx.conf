http {
   # Настройка upstream для балансировки нагрузки
   upstream backend_servers {
       server backend1.example.com;
       server backend2.example.com;
       server backend3.example.com;
   }

   limit_req_zone $binary_remote_addr zone=zone_limit:10m rate=10r/m;

   server {
       listen 80;

       location / {
           proxy_pass http://backend_servers;

           limit_req zone=zone_limit burst=5 nodelay;
           error_page 429 = @zone_rate_limit;
       }

       location @zone_rate_limit {
           return 429;
       }
   }
}
 